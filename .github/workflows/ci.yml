name: Kalite kapısı

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-ve-derleme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6
      - name: pnpm hazırla
        uses: pnpm/setup@v2.1.0
        with:
          version: 11
          install: false
          cache: true
          require-lockfile: true
      - name: Node.js hazırla
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile
      - name: Test, derleme ve uçtan uca demo
        run: pnpm verify
      - name: Docker imajını doğrula
        run: docker build -t datapulse-guardian:${{ github.sha }} .
