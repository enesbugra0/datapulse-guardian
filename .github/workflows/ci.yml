name: Kalite kapısı

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-ve-derleme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: pnpm hazırla
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Node.js hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile
      - name: Test, derleme ve uçtan uca demo
        run: pnpm verify
      - name: Docker imajını doğrula
        run: docker build -t datapulse-guardian:${{ github.sha }} .
